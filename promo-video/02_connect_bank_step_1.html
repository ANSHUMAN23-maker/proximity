<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Connect Bank - Step 1 of 2</title>
<!-- Load Tailwind CSS v3 with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#008774',
              hover: '#007363',
              dark: '#005a4e',
              light: '#e6f3f1'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    /* Remove default outline highlight on mobile tap */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 md:p-6 font-sans antialiased select-none text-slate-800">
<!-- BEGIN: MobileContainer -->
<!-- iPhone-dimensioned screen frame with proper shadow and relative positioning -->
<div class="w-full max-w-[390px] relative flex flex-col justify-between overflow-hidden shadow-2xl rounded-[48px] border border-gray-100" data-purpose="mobile-screen-wrapper" style="width: 390px; height: 840px; aspect-ratio: 390 / 840; background-image: url(&quot;https://lh3.googleusercontent.com/aida/AEtjO1WD-36YVsBImGap7eaS1Z-RKbnLEpg-oj8YG4U3_Bp7_R6jSBK0ZuuAFgAAzUMNS5YJpJO2wTNG6NnAIXcbKBdfiOVKHyYhz4BUHIsUHzrIOGcHbakMUqRj_I4TxbQ3mA9SMvKCHhYY4wlWeqwWOtuiZJZ1amC-LvuYxs3FWlLbV03I8PBhlz6Zu3PTSn03gSEzjha0vEc9QW-OvzGSDCW-I4tZwMwpw-Lhm33w5acrJTMuryq0dClR1w&quot;); background-size: cover; background-position: center center; background-repeat: no-repeat;">
<!-- Top Content Area -->
<div class="w-full flex flex-col">
<!-- BEGIN: StatusBar -->

<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="w-full px-5 py-3 flex items-center justify-between" data-purpose="top-navigation">
<!-- Back Button -->
<button aria-label="Go back" class="p-1.5 -ml-1 text-gray-700 hover:text-black focus:outline-none transition-colors" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Navigation Title -->
<h1 class="text-base font-semibold text-gray-900 tracking-tight">Setup Proximity</h1>
<!-- Help / Support Info Button -->
<button aria-label="Support &amp; Help" class="p-1.5 -mr-1 text-gray-400 hover:text-gray-600 focus:outline-none transition-colors" type="button">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.451 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: StepIndicator -->
<!-- Stepper progress bar and indicator showing Bank details as Step 1 of 2 -->
<div class="w-full px-6 pt-2 pb-5" data-purpose="stepper-indicator">
<div class="flex items-center justify-between text-[13px] font-medium mb-1.5">
<span class="text-brand font-semibold tracking-tight">Bank details</span>
<span class="text-gray-400 text-xs">Step 1 of 2</span>
</div>
<!-- Progress Bar Line -->
<div class="w-full h-[2.5px] bg-gray-100 rounded-full overflow-hidden flex">
<div class="w-1/2 h-full bg-brand rounded-full"></div>
<div class="w-1/2 h-full bg-transparent"></div>
</div>
</div>
<!-- END: StepIndicator -->
<!-- BEGIN: FormContent -->
<main class="w-full px-6 flex flex-col space-y-6" data-purpose="connect-bank-form">
<!-- Header Text Block -->
<div class="space-y-1">
<h2 class="text-2xl font-bold text-gray-900 tracking-tight leading-snug">
            Which bank do you use?
          </h2>
<p class="text-[13px] text-gray-500 leading-relaxed font-normal">
            Enter your bank name to connect your account to proximity.
          </p>
</div>
<!-- Inputs Container -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Field 1: Bank Name -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-gray-700 tracking-tight" for="bank-name-input">
              Bank name
            </label>
<div class="relative flex items-center">
<!-- Bank Pillar Icon -->
<div class="absolute left-3.5 text-gray-600 pointer-events-none flex items-center">
<svg class="w-4 h-4 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.5M4.5 21V10.5M3 21h18M2.25 9.75h19.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-10 pr-3.5 py-3 text-sm font-normal text-gray-900 bg-white border border-gray-300 rounded-xl focus:ring-1 focus:ring-brand focus:border-brand shadow-sm transition" id="bank-name-input" readonly="" type="text" value="Union Bank of India">
</div>
<!-- Helper Text -->
<p class="text-[11px] text-gray-400 pl-0.5">
              Use the full name shown on your bank account.
            </p>
</div>
<!-- Field 2: Full Name -->
<div class="space-y-1.5">
<label class="block text-base font-semibold text-gray-900 tracking-tight" for="full-name-input">
              Full Name:
            </label>
<p class="text-[12px] text-gray-500 pb-0.5 leading-snug">
              Enter your full name as mentioned in your bank passbook.
            </p>
<div class="space-y-1">
<span class="block text-xs font-semibold text-gray-700 tracking-tight">Full name</span>
<input class="w-full px-3.5 py-3 text-sm font-normal text-gray-900 bg-white border border-gray-300 rounded-xl focus:ring-1 focus:ring-brand focus:border-brand shadow-sm transition" id="full-name-input" type="text" value="Biswajeet Sahoo">
</div>
</div>
</form>
</main>
<!-- END: FormContent -->
</div>
<!-- BEGIN: FooterActions -->
<!-- Bottom Reassurance Note & Primary Action Button -->
<footer class="w-full px-6 pb-2 pt-3 flex flex-col space-y-3.5" data-purpose="screen-footer">
<!-- Security reassurance message with padlock -->
<div class="flex items-center justify-center space-x-1.5 text-gray-400">
<svg class="w-3.5 h-3.5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-normal tracking-tight">
          Proximity never asks for bank sensitive information
        </span>
</div>
<!-- Continue CTA Button -->
<button class="w-full h-12 bg-brand text-white font-medium text-[15px] rounded-xl flex items-center justify-center space-x-2 shadow-sm active:bg-brand-hover focus:outline-none transition-colors" type="button">
<span class="">Continue</span>
<!-- Arrow right icon -->
<svg class="w-4 h-4 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Home Indicator bar (iOS) -->
<div class="w-full pt-1.5 pb-1 flex justify-center items-center">
<div class="w-32 h-1 bg-black rounded-full"></div>
</div>
</footer>
<!-- END: FooterActions -->
</div>
<!-- END: MobileContainer -->






</body></html>

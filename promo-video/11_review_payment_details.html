<!DOCTYPE html><html lang="en" style="width: 390px; height: 840px; overflow: hidden; position: relative;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Review Payment - Proximity</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              crimson: '#8E1719',
              crimsonHover: '#761214',
              teal: '#008374',
            },
            neutral: {
              card: '#FBFBFC',
              border: '#F0F1F3',
              subtle: '#6B7280',
              muted: '#8A92A6',
              label: '#9CA3AF'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="base-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      background-color: #F2F4F7;
    }
    .custom-scroll-hidden::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll-hidden {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-gray-100 font-sans text-gray-900">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[393px] h-[852px] bg-white sm:rounded-[48px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-gray-100" data-purpose="mobile-container" style="width: 390px; max-width: 390px; height: 840px; max-height: 840px; min-height: 840px;">
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto custom-scroll-hidden flex flex-col">
<!-- BEGIN: StatusBar -->

<!-- END: StatusBar -->
<!-- BEGIN: NavigationHeader -->
<nav class="w-full px-5 pt-3 pb-2 flex items-center justify-between shrink-0" data-purpose="top-navigation">
<!-- Back Arrow Button -->
<button aria-label="Go back" class="p-2 -ml-2 text-gray-700 hover:text-gray-900 transition-colors focus:outline-none">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Navigation Title -->
<h1 class="text-base font-semibold text-gray-900 text-center tracking-tight">Review payment</h1>
<!-- Help Info Button -->
<button aria-label="Help &amp; Information" class="p-2 -mr-2 text-gray-400 hover:text-gray-600 transition-colors focus:outline-none">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" stroke-linecap="round"></path>
<line stroke-linecap="round" stroke-width="2.5" x1="12" x2="12.01" y1="16.5" y2="16.5"></line>
</svg>
</button>
</nav>
<!-- END: NavigationHeader -->
<!-- BEGIN: AmountHeaderSection -->
<section class="text-center pt-5 pb-6" data-purpose="payment-hero">
<!-- Status Subtitle -->
<p class="text-xs font-normal text-gray-400 tracking-wide mb-1">You've send</p>
<!-- Primary Amount Display -->
<div class="text-[34px] leading-tight font-bold tracking-tight text-gray-950 flex items-center justify-center">
<span class="">₹48.00</span>
</div>
</section>
<!-- END: AmountHeaderSection -->
<!-- BEGIN: TransactionDetailsSection -->
<main class="px-5 space-y-4 flex-1">
<!-- Primary Receipt Card -->
<div class="bg-[#FBFBFC] rounded-2xl p-5 border border-gray-100 shadow-[0_1px_3px_rgba(0,0,0,0.02)] space-y-3.5" data-purpose="details-card">
<!-- Bank Reference Row -->
<div class="flex justify-between items-center text-[12.5px] leading-tight">
<span class="text-gray-400 font-normal">Bank Reference</span>
<span class="text-gray-900 font-normal">Reference</span>
</div>
<!-- Bank Row -->
<div class="flex justify-between items-center text-[12.5px] leading-tight">
<span class="text-gray-400 font-normal">Bank</span>
<span class="text-gray-900 font-medium">Union Bank of India</span>
</div>
<!-- Mode of Payment Row -->
<div class="flex justify-between items-center text-[12.5px] leading-tight">
<span class="text-gray-400 font-normal">Mode of Payment</span>
<span class="text-gray-900 font-normal">via Phone Number</span>
</div>
<!-- Recipient Row -->
<div class="flex justify-between items-center text-[12.5px] leading-tight">
<span class="text-gray-400 font-normal">Recipient</span>
<span class="text-gray-900 font-medium">Anshuman Pati</span>
</div>
<!-- Phone Number Row -->
<div class="flex justify-between items-center text-[12.5px] leading-tight">
<span class="text-gray-400 font-normal">Phone Number</span>
<span class="text-gray-900 font-normal tracking-tight">+91 123 456 7890</span>
</div>
<!-- Date Row -->
<div class="flex justify-between items-center text-[12.5px] leading-tight">
<span class="text-gray-400 font-normal">Date and Time</span>
<span class="text-gray-900 font-normal">4th October 2026, 9:41 AM</span>
</div>
<!-- Horizontal Separator -->
<hr class="border-t border-gray-200/70 my-2">
<!-- Total To Pay Row -->
<div class="flex justify-between items-center pt-0.5">
<span class="text-[13px] font-semibold text-gray-900">Total Paid Amount</span>
<span class="text-[14px] font-bold text-gray-950">₹48.00</span>
</div>
</div>
<!-- Bank Confirmation Status Card -->
<div class="bg-[#FBFBFC] rounded-2xl p-4 border border-gray-100 shadow-[0_1px_3px_rgba(0,0,0,0.02)] space-y-1" data-purpose="bank-confirmation-card">
<h2 class="text-xs font-semibold text-gray-900 leading-tight">Bank confirmation</h2>
<p class="text-[11.5px] text-gray-400 font-normal leading-tight">₹48 debited • IDFC Bank</p>
</div>
</main>
<!-- END: TransactionDetailsSection -->
</div>
<!-- BEGIN: FooterAction -->
<footer class="w-full px-5 pb-2 pt-2 bg-white shrink-0" data-purpose="action-buttons-area">
<!-- Delete Transaction Destructive Button -->
<button class="w-full py-3.5 bg-brand-crimson hover:bg-brand-crimsonHover active:scale-[0.99] text-white font-medium text-[14px] rounded-xl transition duration-150 ease-in-out shadow-sm flex items-center justify-center" data-purpose="delete-action-button" type="button">
        Delete Transaction
      </button>
<!-- iOS Home Bar Indicator -->
<div class="w-full flex justify-center pt-4 pb-1" data-purpose="home-indicator">
<div class="w-32 h-1 bg-black rounded-full"></div>
</div>
</footer>
<!-- END: FooterAction -->
</div>
<!-- END: MobileDeviceFrame -->






</body></html>

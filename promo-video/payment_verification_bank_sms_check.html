<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Payment Status Confirmation - Proximity</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            proximity: {
              dark: '#080a0f',
              card: '#121620',
              border: '#1e2638',
              accent: '#00d2b4',
              warning: '#f59e0b',
              failed: '#e53e3e',
              success: '#22c55e',
            }
          }
        }
      }
    };
  </script>
<style data-purpose="custom-layout">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Subtle pulsing effect for warning glow */
    @keyframes alertGlow {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
      }
      50% {
        opacity: 0.35;
        transform: scale(1.08);
      }
    }
    .warning-glow {
      animation: alertGlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#050608] min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-100">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[390px] h-[844px] bg-[#090b10] border border-slate-800/80 rounded-[48px] shadow-2xl flex flex-col justify-between overflow-hidden" style="width: 390px; height: 840px; aspect-ratio: 390 / 840; max-height: 840px;">
<!-- Top Glow Accent Layer -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-64 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- BEGIN: TopBar -->
<header class="relative z-10 pt-4 px-6 flex flex-col gap-2" data-purpose="mobile-header">
<!-- iOS Status Bar Simulation -->

<!-- App Header Navigation Bar -->
<nav class="flex items-center justify-between mt-3 text-slate-300">
<button aria-label="Dismiss screen" class="w-9 h-9 rounded-full bg-slate-800/60 border border-slate-700/60 flex items-center justify-center hover:bg-slate-700/60 transition active:scale-95" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
<div class="flex items-center gap-1.5 text-xs font-medium tracking-wide text-slate-400">
<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
<span class="">Proximity Offline UPI</span>
</div>
<button aria-label="Support info" class="w-9 h-9 rounded-full bg-slate-800/60 border border-slate-700/60 flex items-center justify-center hover:bg-slate-700/60 transition active:scale-95" type="button">
<svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
</nav>
</header>
<!-- END: TopBar -->
<!-- BEGIN: VerificationContent -->
<main class="relative z-10 px-6 flex flex-col items-center text-center my-auto" data-purpose="verification-body">
<!-- Warning Triangle Centerpiece -->
<div class="relative flex items-center justify-center mb-6">
<!-- Glow Backing -->
<div class="absolute w-28 h-28 bg-amber-500 rounded-full blur-2xl warning-glow"></div>
<!-- Triangle Caution Icon -->
<div aria-hidden="true" class="relative w-24 h-24 flex items-center justify-center">
<svg class="w-20 h-20 text-[#f59e0b] drop-shadow-[0_4px_16px_rgba(245,158,11,0.4)]" fill="currentColor" viewBox="0 0 24 24">
<path clip-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a1 1 0 100-2 1 1 0 000 2z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
<!-- Main Headline from Reference Image -->
<h1 class="text-xl sm:text-[22px] font-bold tracking-tight text-white max-w-[280px] leading-snug">
        We didn't receive a bank SMS yet.
      </h1>
<!-- Sub-question Prompt from Reference Image -->
<p class="text-base text-slate-400 font-medium mt-2 mb-5">
        Did your payment succeed?
      </p>
<!-- Transaction Info Badge -->

<!-- Microcopy for User Clarity -->

</main>
<!-- END: VerificationContent -->
<!-- BEGIN: ActionButtonsSection -->
<footer class="relative z-10 px-6 pb-8 flex flex-col gap-4" data-purpose="decision-actions">
<!-- Primary Action Buttons (Side by Side matching reference design) -->
<div class="grid grid-cols-2 gap-3.5 w-full">
<!-- Negative Response Action: "No, Failed" -->
<button class="w-full py-3.5 px-4 bg-[#e53e3e] hover:bg-[#dc2626] active:scale-[0.98] text-white font-medium text-sm sm:text-base rounded-xl transition duration-150 shadow-lg shadow-red-950/40 flex items-center justify-center text-center" id="btn-failed" type="button">
          No, Failed
        </button>
<!-- Positive Response Action: "Yes, Succeeded" -->
<button class="w-full py-3.5 px-4 bg-[#22c55e] hover:bg-[#16a34a] active:scale-[0.98] text-white font-medium text-sm sm:text-base rounded-xl transition duration-150 shadow-lg shadow-emerald-950/40 flex items-center justify-center text-center" id="btn-succeeded" type="button">
          Yes, Succeeded
        </button>
</div>
<!-- Secondary Help Link -->
<div class="flex flex-col items-center gap-2">

</div>
<!-- Standard iOS Home Bar Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-slate-700/80 rounded-full mx-auto mt-2"></div>
</footer>
<!-- END: ActionButtonsSection -->
</div>
<!-- END: MobileDeviceFrame -->
<!-- Interactivity Handler -->
<script data-purpose="interaction-script">
    document.getElementById('btn-failed').addEventListener('click', () => {
      console.log('Action: Payment marked as Failed.');
    });

    document.getElementById('btn-succeeded').addEventListener('click', () => {
      console.log('Action: Payment marked as Succeeded.');
    });
  </script>






</body></html>

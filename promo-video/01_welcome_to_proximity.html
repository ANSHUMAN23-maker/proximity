<!DOCTYPE html><html class="h-full bg-[#f7f9fb]" lang="en" style="opacity: 1 !important; visibility: visible !important;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Welcome to Proximity</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            proximity: {
              teal: '#008774',
              tealDark: '#007060',
              tealLight: '#e6f4f1',
              dark: '#0f172a',
              muted: '#64748b'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
<style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f7f9fb;
      -webkit-tap-highlight-color: transparent;
      opacity: 1 !important;
      visibility: visible !important;
    }
  </style>
</head>
<body class="min-h-full flex flex-col items-center justify-center p-0 sm:p-4 text-slate-900 bg-[#f7f9fb] antialiased font-sans" style="opacity: 1 !important; visibility: visible !important;">
<!-- BEGIN: MobileDeviceContainer -->
<div class="w-full max-w-[390px] h-[844px] min-h-[844px] max-h-[844px] bg-white relative flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[48px] border-0 sm:border-[8px] sm:border-neutral-900 select-none mx-auto" style="opacity: 1 !important; visibility: visible !important;">
<!-- BEGIN: iOSStatusBar -->

<!-- END: iOSStatusBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center -mt-6 relative z-10">
<!-- Subtitle text -->
<p class="text-[14px] font-normal text-slate-500 tracking-wide mb-6">Welcome to</p>
<!-- App Logo -->
<div class="relative w-28 h-28 flex items-center justify-center mb-6" data-purpose="app-logo">
<div class="w-28 h-28 rounded-3xl bg-white shadow-lg shadow-teal-900/5 flex items-center justify-center p-2.5 border border-slate-100">
<img alt="Proximity Logo" class="w-full h-full object-contain rounded-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATwqnsCoBHBhMttvDoUmWVyHppL_DSpOwiYdIhOYW0xZIhuou6dEkCnebNUnIMO8_49L_gneZzwtsdaMoNWdYZHGwFmb9F3GMTHQFeCEuhfdodlgcCvu0uGz47MJsI3ay-S-Wq3PmbltIA1WSYaAkRbinV5nxO0fdWV8FxAasrAgeLxWS5oZuhgmgIItnbgAlIrv-T0KIvFCeKvDCirIIKY6eBgwedp3Ujz5eqSk3oGywDOIk6BxaOVBVAKRHs8byN">
</div>
</div>
<!-- Main Brand Name -->
<h1 class="text-[32px] font-bold text-[#0f172a] tracking-tight mb-4">Proximity</h1>
<!-- Taglines -->
<div class="space-y-1 text-center">
<p class="text-[14px] leading-relaxed text-slate-600 font-normal">Pay anyone, anywhere.</p>
<p class="text-[14px] leading-relaxed text-slate-600 font-normal">Without internet.</p>
<p class="text-[14px] leading-relaxed text-slate-600 font-normal">Simple payments, closer to you.</p>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterActionSection -->
<footer class="w-full px-6 pb-4 flex flex-col items-center relative z-10 shrink-0">
<!-- Interactive Terms Checkbox Container -->
<div class="w-full max-w-[340px] mb-4 bg-slate-50 border border-slate-200/80 rounded-2xl p-4">
<label class="flex items-center space-x-3 cursor-pointer text-left select-none">
<input checked="" class="w-4 h-4 rounded border-slate-300 text-[#008774] focus:ring-0 focus:ring-offset-0 cursor-pointer transition-colors accent-[#008774]" id="termsCheckbox" type="checkbox">
<span class="text-[13px] text-slate-700 leading-none">I agree to the <a class="text-[#008774] underline font-medium hover:opacity-85" href="#">Terms &amp; Conditions</a></span>
</label>
<p class="text-[11.5px] text-slate-400 mt-2 text-left pl-7">Accept the terms to continue.</p>
</div>
<!-- Primary Action Button -->
<button class="w-full max-w-[340px] h-[52px] rounded-full bg-[#008774] hover:bg-[#007464] text-white font-medium text-[15px] flex items-center justify-center space-x-2 shadow-sm transition-all duration-200 cursor-pointer active:scale-[0.99]" id="continueButton" type="button">
<span class="">Continue</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- iOS Home Indicator -->
<div class="w-32 h-[4.5px] bg-neutral-900 rounded-full mt-6 mb-1"></div>
</footer>
<!-- END: FooterActionSection -->
</div>
<!-- END: MobileDeviceContainer -->
<!-- BEGIN: Interactive Logic for Terms Toggle -->
<script data-purpose="terms-toggle">
    const termsCheckbox = document.getElementById('termsCheckbox');
    const continueBtn = document.getElementById('continueButton');

    termsCheckbox.addEventListener('change', function () {
      if (this.checked) {
        // Active state
        continueBtn.disabled = false;
        continueBtn.classList.remove('bg-slate-200', 'text-slate-400', 'cursor-not-allowed', 'shadow-none');
        continueBtn.classList.add('bg-[#008774]', 'hover:bg-[#007464]', 'text-white', 'shadow-sm', 'cursor-pointer', 'active:scale-[0.99]');
      } else {
        // Disabled state
        continueBtn.disabled = true;
        continueBtn.classList.add('bg-slate-200', 'text-slate-400', 'cursor-not-allowed', 'shadow-none');
        continueBtn.classList.remove('bg-[#008774]', 'hover:bg-[#007464]', 'text-white', 'shadow-sm', 'cursor-pointer', 'active:scale-[0.99]');
      }
    });
  </script>
<!-- END: Interactive Logic for Terms Toggle -->


</body></html>

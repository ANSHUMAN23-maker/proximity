<!-- Global Custom Styles & Spring Pop, Draw & Particle Burst Animations -->
<style data-purpose="layout-styles">
    /* Ensure sleek mobile viewport display with high-fidelity iOS appearance */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Spring Pop for Badge */
    @keyframes springPop {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
      75% {
        transform: scale(0.96);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* SVG Stroke Draw for Checkmark */
    @keyframes drawCheck {
      0% {
        stroke-dashoffset: 200;
        opacity: 0;
      }
      15% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    /* Shockwave Ripple */
    @keyframes shockwave {
      0% {
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 0.85;
      }
      60% {
        opacity: 0.45;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.65);
        opacity: 0;
      }
    }

    /* Radial Particle Burst */
    @keyframes burstFly {
      0% {
        transform: translate(0, 0) scale(0) rotate(0deg);
        opacity: 0;
      }
      25% {
        opacity: 1;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(var(--scale, 1)) rotate(var(--rot, 180deg));
        opacity: 0;
      }
    }

    /* Animation Classes */
    .animate-badge-pop {
      animation: springPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: center;
    }

    .animate-check-draw {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawCheck 0.45s 0.35s ease-out forwards;
    }

    .animate-shockwave {
      animation: shockwave 0.85s 0.22s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    .burst-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      pointer-events: none;
      opacity: 0;
      animation: burstFly 0.85s cubic-bezier(0.15, 0.85, 0.35, 1) forwards;
      animation-delay: var(--delay, 0.25s);
    }

    /* Accessibility: Prefers Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .animate-badge-pop {
        animation: none !important;
        transform: scale(1) !important;
        opacity: 1 !important;
      }
      .animate-check-draw {
        animation: none !important;
        stroke-dashoffset: 0 !important;
        opacity: 1 !important;
      }
      .animate-shockwave,
      .burst-particle {
        display: none !important;
      }
    }
  </style>

<!-- Interactive Re-trigger Script -->
<script>
  const celebrationContainer = document.getElementById('badge-celebration');
  if (celebrationContainer) {
    const replayAnimation = () => {
      // Re-trigger CSS animations by cloning & replacing node
      const newContainer = celebrationContainer.cloneNode(true);
      celebrationContainer.parentNode.replaceChild(newContainer, celebrationContainer);
      newContainer.addEventListener('click', replayAnimation);
      newContainer.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          replayAnimation();
        }
      });
    };
    celebrationContainer.addEventListener('click', replayAnimation);
    celebrationContainer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        replayAnimation();
      }
    });
  }
</script>

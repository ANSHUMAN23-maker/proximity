<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {

        extend: {
          colors: {
            teal: {

              600: '#008479',
              700: '#006e64',

    }
    /* Blinking cursor animation */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: blink 1s step-start infinite;
    }
  </style>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4 font-sans antialiased">

<button aria-label="Go Back" class="p-1 -ml-1 text-gray-700 hover:text-black" type="button">
<svg class="w-5 h-5 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>

<h1 class="text-sm font-semibold text-gray-900 tracking-tight">Pay a number</h1>

<main class="px-5 pt-3">

<div class="space-y-1.5 mb-6">

<p class="text-xs leading-relaxed text-gray-500">

          </p>
</div>
<!-- Phone Input Container -->
<div class="space-y-2 mb-3">
<label class="block text-xs font-normal text-gray-600">Mobile number</label>
<div class="flex items-center border border-teal-600 rounded-lg px-3 py-2.5 bg-white shadow-sm focus-within:ring-1 focus-within:ring-teal-600">

<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>

</div>

</button>

<!-- Key: 3 -->

<span class="text-[9px] font-semibold text-gray-400 tracking-wider leading-tight mt-1">MNO</span>
</button>
<!-- Key: 7 -->
<button class="flex flex-col items-center justify-center py-2 active:bg-gray-100 rounded-lg transition-colors" type="button">
<span class="text-xl font-normal text-gray-900 leading-none">7</span>
<span class="text-[9px] font-semibold text-gray-400 tracking-wider leading-tight mt-1">PQRS</span>
</button>
<!-- Key: 8 -->
<button class="flex flex-col items-center justify-center py-2 active:bg-gray-100 rounded-lg transition-colors" type="button">
<span class="text-xl font-normal text-gray-900 leading-none">8</span>
<span class="text-[9px] font-semibold text-gray-400 tracking-wider leading-tight mt-1">TUV</span>
</button>
<!-- Key: 9 -->

<span class="text-xl font-normal text-gray-900 leading-none">9</span>
<span class="text-[9px] font-semibold text-gray-400 tracking-wider leading-tight mt-1">WXYZ</span>
</button>
<!-- Key: + -->
<button class="flex flex-col items-center justify-center py-2 active:bg-gray-100 rounded-lg transition-colors" type="button">
<span class="text-xl font-normal text-gray-800 leading-none">+</span>
<span class="text-[9px] text-transparent leading-tight mt-1 select-none">.</span>
</button>
<!-- Key: 0 -->
<button class="flex flex-col items-center justify-center py-2 active:bg-gray-100 rounded-lg transition-colors" type="button">
<span class="text-xl font-normal text-gray-900 leading-none">0</span>
<span class="text-[9px] text-transparent leading-tight mt-1 select-none">.</span>

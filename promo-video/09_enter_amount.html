<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Enter Amount - Proximity</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind configuration for exact color accents -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {
              DEFAULT: '#00877a',
              dark: '#007065',
              subtle: '#e6f3f2'
            },
            charcoal: '#111827',
            neutralGray: '#f8fafc',
            borderGray: '#e2e8f0'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
<!-- Custom styles for iOS look and touch interactions -->
<style data-purpose="mobile-layout">
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .keypad-btn:active {
      background-color: #f1f5f9;
      transform: scale(0.97);
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: PhoneContainer -->
<!-- Target device container matching iPhone 14/15 proportions (~390px width) -->
<main class="w-full max-w-[390px] sm:rounded-[48px] shadow-2xl flex flex-col justify-between relative overflow-hidden border border-gray-200" style="width: 390px; height: 840px; aspect-ratio: 390/840; background-image: url('https://lh3.googleusercontent.com/aida/AEtjO1WD-36YVsBImGap7eaS1Z-RKbnLEpg-oj8YG4U3_Bp7_R6jSBK0ZuuAFgAAzUMNS5YJpJO2wTNG6NnAIXcbKBdfiOVKHyYhz4BUHIsUHzrIOGcHbakMUqRj_I4TxbQ3mA9SMvKCHhYY4wlWeqwWOtuiZJZ1amC-LvuYxs3FWlLbV03I8PBhlz6Zu3PTSn03gSEzjha0vEc9QW-OvzGSDCW-I4tZwMwpw-Lhm33w5acrJTMuryq0dClR1w'); background-size: cover; background-position: center; background-repeat: no-repeat;">
<!-- BEGIN: TopBarAndContent -->
<div class="w-full flex flex-col">
<!-- BEGIN: iOSStatusBar -->

<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationHeader -->
<header class="w-full px-5 py-3 flex items-center justify-between" data-purpose="app-header">
<!-- Back button -->
<button aria-label="Go back" class="p-1 text-gray-800 hover:text-black" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
<path d="M19 12H5M12 19l-7-7 7-7"></path>
</svg>
</button>
<!-- Page title -->
<h1 class="text-[16px] font-semibold text-charcoal">Enter amount</h1>
<!-- Help icon -->
<button aria-label="Help and support" class="p-1 text-gray-500 hover:text-black" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
<line x1="12" x2="12.01" y1="17" y2="17"></line>
</svg>
</button>
</header>
<!-- END: NavigationHeader -->
<!-- BEGIN: RecipientCard -->
<!-- Card displaying who the payment is destined to -->
<section class="mx-5 mt-2 bg-[#f9fafb] border border-gray-200 rounded-xl px-4 py-3" data-purpose="recipient-info">
<p class="text-xs text-gray-500 font-medium tracking-tight">Payment is being processed to:</p>
<p class="text-sm font-semibold text-gray-800 mt-0.5 tracking-tight">+91 123 456 7890</p>
</section>
<!-- END: RecipientCard -->
<!-- BEGIN: AmountDisplay -->
<!-- Displays the target entry amount with bold styling -->
<section class="mt-14 mb-4 text-center px-4" data-purpose="amount-section">
<span class="text-xs font-medium text-gray-400 block mb-2 tracking-wide">Enter the Amount:</span>
<div class="flex items-center justify-center">
<span class="text-[44px] font-bold text-gray-900 tracking-tight leading-none">₹48.00</span>
</div>
</section>
<!-- END: AmountDisplay -->
</div>
<!-- END: TopBarAndContent -->
<!-- BEGIN: KeypadAndCTA -->
<div class="w-full pb-4 px-6 flex flex-col justify-end" data-purpose="interactive-bottom-area">
<!-- BEGIN: NumericKeypad -->
<div class="grid grid-cols-3 gap-y-4 gap-x-6 text-center mb-6 pt-2" data-purpose="numeric-keypad">
<!-- Row 1 -->
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">1</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">2</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">3</button>
<!-- Row 2 -->
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">4</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">5</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">6</button>
<!-- Row 3 -->
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">7</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">8</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">9</button>
<!-- Row 4 -->
<button class="keypad-btn py-2 text-2xl font-bold text-gray-800 rounded-lg transition leading-none flex items-center justify-center pb-2" type="button">.</button>
<button class="keypad-btn py-2 text-2xl font-normal text-gray-900 rounded-lg transition" type="button">0</button>
<button aria-label="Backspace" class="keypad-btn py-2 flex items-center justify-center text-gray-800 rounded-lg transition" type="button">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
<path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
<line x1="18" x2="12" y1="9" y2="15"></line>
<line x1="12" x2="18" y1="9" y2="15"></line>
</svg>
</button>
</div>
<!-- END: NumericKeypad -->
<!-- BEGIN: ActionButton -->
<div class="w-full pb-3" data-purpose="primary-action-container">
<button class="w-full bg-[#00877a] hover:bg-[#007065] active:scale-[0.99] text-white font-medium text-[15px] py-3.5 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-sm" type="button">
<span class="">Review payment</span>
<svg class="w-4 h-4 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewBox="0 0 24 24">
<path d="M5 12h14M12 5l7 7-7 7"></path>
</svg>
</button>
</div>
<!-- END: ActionButton -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="w-full flex justify-center pt-2 pb-1" data-purpose="home-indicator-container">
<div class="w-32 h-1 bg-black rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: KeypadAndCTA -->
</main>
<!-- END: PhoneContainer -->




</body></html>

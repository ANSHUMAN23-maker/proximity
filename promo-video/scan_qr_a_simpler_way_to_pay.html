<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Scan QR - Payment</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            reticle: '#6da0e5',
            crimson: '#b92b37',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

</head>
<body class="bg-neutral-950 text-white min-h-screen flex items-center justify-center p-0 sm:p-4 select-none antialiased font-sans">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Mimics mobile device dimensions and viewport aspect ratio -->
<main class="relative w-full max-w-[412px] h-[100dvh] max-h-[880px] sm:rounded-[44px] overflow-hidden flex flex-col justify-between shadow-2xl bg-neutral-900 border border-neutral-800/50" style="width: 390px; height: 840px; aspect-ratio: 390 / 840; max-width: 390px; max-height: 840px;">
<!-- BEGIN: BackgroundLayer -->
<!-- Authentic backdrop representing blurred coffee tabletop atmosphere -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden" data-purpose="photo-backdrop">
<!-- Dark slate stone textured base -->
<div class="absolute inset-0 bg-[#161a1d] bg-radial from-slate-800/40 via-[#14181b] to-[#0c0e10]"></div>
<!-- Blurred background elements mimicking the coffee cup and potted plant -->
<!-- Coffee saucer & cup on upper-left -->
<div class="absolute -top-10 -left-20 w-80 h-80 rounded-full bg-stone-300/15 blur-3xl"></div>
<div class="absolute top-12 -left-12 w-52 h-52 rounded-full border-[18px] border-stone-200/10 bg-amber-900/15 blur-xl"></div>
<div class="absolute top-24 -left-4 w-32 h-32 rounded-full bg-amber-700/20 blur-lg"></div>
<!-- Potted green plant leaves on upper-right -->
<div class="absolute top-4 -right-16 w-60 h-60 rounded-full bg-emerald-950/40 blur-2xl"></div>
<div class="absolute top-12 right-2 w-28 h-28 rounded-full bg-emerald-600/15 blur-xl"></div>
<div class="absolute top-44 right-1 w-24 h-24 rounded-full bg-emerald-800/20 blur-lg"></div>
<!-- Surface noise / slate texture simulation overlay -->
<div class="absolute inset-0 opacity-[0.22] mix-blend-overlay bg-[radial-gradient(#ffffff_1px,transparent_1px)] [background-size:16px_16px]"></div>
<div class="absolute inset-0 bg-gradient-to-b from-black/55 via-transparent to-black/80"></div>
</div>
<!-- END: BackgroundLayer -->
<!-- BEGIN: ScreenContent -->
<div class="relative z-10 flex flex-col h-full justify-between pt-7 pb-6 px-6">
<!-- BEGIN: HeaderSection -->
<header class="flex flex-col items-center text-center mt-3" data-purpose="screen-header">
<!-- Top Title Bar -->
<h1 class="text-[17px] font-semibold tracking-tight text-white drop-shadow-[0_1px_3px_rgba(0,0,0,0.8)]">
          Scan QR
        </h1>
<!-- Primary Heading & Instruction -->
<div class="mt-8 px-2">
<h2 class="text-[27px] font-bold tracking-tight text-white drop-shadow-md leading-tight">
            A simpler way to pay.
          </h2>
<p class="mt-2 text-[15px] font-normal text-white/75 leading-snug drop-shadow-sm tracking-wide">
            Place a proximity QR code inside the frame.
          </p>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: ScannerReticleSection -->
<div class="flex flex-col items-center justify-center my-auto pt-2" data-purpose="scanner-viewfinder">
<!-- Reticle and QR Outer Box -->
<div class="relative w-[286px] h-[286px] flex items-center justify-center">
<!-- Viewfinder Corner Brackets (Cyan / Blue rounded guides) -->
<!-- Top Left Corner -->
<div class="absolute -top-3 -left-3 w-12 h-12 border-t-[3.5px] border-l-[3.5px] border-[#6ea5ec] rounded-tl-2xl"></div>
<!-- Top Right Corner -->
<div class="absolute -top-3 -right-3 w-12 h-12 border-t-[3.5px] border-r-[3.5px] border-[#6ea5ec] rounded-tr-2xl"></div>
<!-- Bottom Left Corner -->
<div class="absolute -bottom-3 -left-3 w-12 h-12 border-b-[3.5px] border-l-[3.5px] border-[#6ea5ec] rounded-bl-2xl"></div>
<!-- Bottom Right Corner -->
<div class="absolute -bottom-3 -right-3 w-12 h-12 border-b-[3.5px] border-r-[3.5px] border-[#6ea5ec] rounded-br-2xl"></div>
<!-- White Square Container for QR Code -->
<div class="relative w-[232px] h-[232px] bg-white rounded-[26px] p-4 flex items-center justify-center shadow-2xl overflow-hidden">
<!-- High fidelity SVG QR Code replica -->
<svg aria-label="Proximity QR Code" class="w-full h-full text-slate-900" fill="currentColor" role="img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Top-Left Position Detection Pattern -->
<path d="M 6 6 H 34 V 34 H 6 Z M 10 10 V 30 H 30 V 10 Z"></path>
<rect height="12" rx="1.5" width="12" x="14" y="14"></rect>
<!-- Top-Right Position Detection Pattern -->
<path d="M 66 6 H 94 V 34 H 66 Z M 70 10 V 30 H 90 V 10 Z"></path>
<rect height="12" rx="1.5" width="12" x="74" y="14"></rect>
<!-- Bottom-Left Position Detection Pattern -->
<path d="M 6 66 H 34 V 94 H 6 Z M 10 70 V 90 H 30 V 70 Z"></path>
<rect height="12" rx="1.5" width="12" x="14" y="74"></rect>
<!-- Inner QR Code Matrix Dots & Functional Patterns -->
<!-- Top Row Clusters -->
<rect height="5" width="5" x="38" y="6"></rect>
<rect height="5" width="6" x="47" y="6"></rect>
<rect height="5" width="5" x="57" y="6"></rect>
<!-- Row 2 -->
<rect height="5" width="6" x="42" y="14"></rect>
<rect height="6" width="6" x="52" y="14"></rect>
<!-- Row 3 & Timing Patterns -->
<rect height="5" width="5" x="38" y="23"></rect>
<rect height="6" width="6" x="47" y="22"></rect>
<rect height="5" width="5" x="57" y="23"></rect>
<rect height="5" width="5" x="10" y="38"></rect>
<rect height="5" width="6" x="18" y="42"></rect>
<rect height="5" width="5" x="27" y="38"></rect>
<!-- Center Hub Data Modules -->
<rect height="7" width="5" x="38" y="34"></rect>
<rect height="5" width="8" x="46" y="32"></rect>
<rect height="7" width="5" x="57" y="34"></rect>
<rect height="6" width="6" x="35" y="44"></rect>
<rect height="12" width="12" x="44" y="42"></rect>
<rect height="6" width="6" x="59" y="44"></rect>
<rect height="6" width="5" x="38" y="57"></rect>
<rect height="5" width="8" x="46" y="57"></rect>
<rect height="6" width="5" x="57" y="57"></rect>
<!-- Right Center Pattern -->
<rect height="5" width="5" x="68" y="38"></rect>
<rect height="5" width="6" x="76" y="42"></rect>
<rect height="5" width="5" x="85" y="38"></rect>
<rect height="6" width="6" x="68" y="48"></rect>
<rect height="6" width="12" x="78" y="49"></rect>
<!-- Bottom Right Data Cluster -->
<rect height="6" width="6" x="38" y="68"></rect>
<rect height="6" width="6" x="48" y="68"></rect>
<rect height="6" width="6" x="58" y="68"></rect>
<rect height="12" rx="1" width="12" x="68" y="66"></rect>
<rect height="6" width="6" x="84" y="66"></rect>
<rect height="14" width="6" x="84" y="76"></rect>
<rect height="8" width="12" x="68" y="82"></rect>
<rect height="12" width="5" x="38" y="78"></rect>
<rect height="6" width="7" x="47" y="78"></rect>
<rect height="12" width="6" x="57" y="78"></rect>
<rect height="5" width="7" x="47" y="87"></rect>
</svg>
</div>

</div>
<!-- Quick Action Floating Buttons: Flash & Upload -->
<nav aria-label="Scanner Tools" class="flex items-center justify-center gap-3 mt-8">
<!-- Flash Button -->
<button class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-900/70 hover:bg-slate-800/80 active:scale-95 transition-all backdrop-blur-md border border-white/10 text-[14px] font-medium text-white shadow-lg shadow-black/40" type="button">
<!-- Flashlight icon -->
<svg class="w-4 h-4 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<path d="M18 6c0 2-2 4-2 7v5a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-5c0-3-2-5-2-7V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v2z"></path>
<line x1="6" x2="18" y1="9" y2="9"></line>
<line x1="12" x2="12" y1="13" y2="15"></line>
</svg>
<span class="">Flash</span>
</button>
<!-- Upload Button -->
<button class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-900/70 hover:bg-slate-800/80 active:scale-95 transition-all backdrop-blur-md border border-white/10 text-[14px] font-medium text-white shadow-lg shadow-black/40" type="button">
<!-- Picture/Upload gallery icon -->
<svg class="w-4 h-4 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<rect height="18" rx="2" ry="2" width="18" x="3" y="3"></rect>
<circle cx="8.5" cy="8.5" r="1.5"></circle>
<polyline points="21 15 16 10 5 21"></polyline>
</svg>
<span class="">Upload</span>
</button>
</nav>
</div>
<!-- END: ScannerReticleSection -->
<!-- BEGIN: BottomActionSection -->
<!-- Distinct white card housing the Cancel Payment button -->
<footer class="w-full mt-4" data-purpose="bottom-controls"><button type="button" class="w-full py-4 rounded-2xl bg-red-600 hover:bg-red-700 active:scale-[0.98] transition-all font-semibold text-[17px] text-white shadow-lg shadow-black/30 text-center">
  Cancel
</button></footer>
<!-- END: BottomActionSection -->
</div>
<!-- END: ScreenContent -->
</main>
<!-- END: MobileDeviceContainer -->




</body></html>
